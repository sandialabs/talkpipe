[build-system]
requires = ["setuptools", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[project]
name = "talkpipe"
authors = [
    {name = "Travis Bauer", email = "tlbauer@sandia.gov"},
]
maintainers = [
    {name = "Travis Bauer", email = "tlbauer@sandia.gov"}
]
description = "Python internal and external DSL for writing generative AI analytics"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["ai"]
license = "Apache-2.0"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
    "Operating System :: OS Independent",
]
# Lower bounds below are security floors, not feature requirements: each one is
# the lowest release of that package with no known vulnerability, as reported by
# `safety`. Left unbounded, a resolver is free to pick a known-vulnerable old
# release, which is what the scan flags. Every floor is far below the version
# currently resolved, so raising them does not change what actually installs --
# raise a floor when a new advisory lands, do not lower one.
dependencies = [
    'prompt_toolkit>=3.0.13',
    'parsy',
    'pydantic>=2.4.0',
    'requests>=2.33.0',
    'numpy>=1.22.2',
    'python-docx>=0.8.6',
    'pandas>=0.16.0',
    'feedparser>=5.1.2',
    'readability-lxml',
    'lxml>=6.1.0',
    'lxml_html_clean>=0.4.5',
    'fastapi[standard]>=0.109.1',
    'pymongo>=4.6.3',
    'scikit-learn>=1.5.0',
    'uvicorn>=0.12.3',
    'whoosh',
    'lancedb',
    'pyyaml>=5.4',
    'greenlet',
    'networkx',
    # Security override: starlette is a transitive dependency of FastAPI,
    # floored here because FastAPI's own requirement (>=0.46.0) is looser than
    # the security floor. >=0.49.1 fixed CVE-2025-62727 (DoS); >=1.3.1 also
    # covers the advisories published since, the latest being CVE-2026-54283,
    # which is first fixed in 1.3.1.
    "starlette>=1.3.1",
]
dynamic = ["version"]

[project.optional-dependencies]
dev = [
    'pytest>=9.0.3',
    'pytest-mock',
    'pytest-cov>=2.0.0',
    'mongomock',
    # Lint/type tools are pinned to a minor series on purpose: ruff promotes
    # new rules and mypy adds checks in minor releases, and CI resolves fresh,
    # so an open floor would turn a tool release into a red build. Bump the
    # pins deliberately (and the ruff-pre-commit rev with them).
    "ruff>=0.16.3,<0.17",
    "mypy>=2.3,<3",
    "pre-commit>=4.0",
]
ollama = [
    'ollama'
]
openai = [
    'openai'
]
anthropic = [
    'anthropic>=0.87.0'
]
pypdf = [
    'pypdf>=6.15.0'
]
pillow = [
    'Pillow>=12.2.0'
]
model2vec = [
    'model2vec>=0.3.4',
]
all = [
    'talkpipe[openai,ollama,anthropic,pypdf,pillow,model2vec]'
]

[project.scripts]
chatterlang_workbench = "talkpipe.app.chatterlang_workbench:main"
chatterlang_script = "talkpipe.app.chatterlang_script:main"
chatterlang_reference_generator = "talkpipe.app.chatterlang_reference_generator:go"
chatterlang_serve = "talkpipe.app.chatterlang_serve:go"
chatterlang_reference_browser = "talkpipe.app.chatterlang_reference_browser:main"
chatterlang_generate_entry_points = "talkpipe.app.chatterlang_generate_entry_points:main"
talkpipe_plugins = "talkpipe.app.talkpipe_plugin_manager:main"
talkpipe_makevectordatabase = "talkpipe.app.makevectordatabase:main"
makevectordatabase = "talkpipe.app.makevectordatabase:main"
run_doc_examples = "talkpipe.app.doc_examples:main"
talkpipe_precache_model2vec = "talkpipe.app.precache_model2vec:main"
serverag = "talkpipe.app.serverag:main"

[tool.setuptools.packages.find]
where = ["src"]

# Add package data to include .ico files
[tool.setuptools.package-data]
"*" = ["*.ico"]
# PEP 561 marker: the package ships inline type information, so consumers'
# type checkers use talkpipe's own annotations instead of treating it as Any.
"talkpipe" = ["py.typed"]
"talkpipe.app" = [
    "static/*.png", "static/*.ico",
    "static/workbench/*.html", "static/workbench/*.css", "static/workbench/*.js",
    "static/workbench/vendor/*.js", "static/workbench/vendor/*.txt",
    "workbench_data/seed_scripts/*.script",
]

[tool.setuptools_scm]
#use defaults

[project.urls]
Homepage = "https://github.com/sandialabs/talkpipe"


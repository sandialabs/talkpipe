[tool.bandit]
# Static security scan of src/ (CI: `bandit -c pyproject.toml -r src/`). No
# severity or confidence filter: bandit's defaults report every finding, and
# the tree is clean at that level. This replaced the old INI-style `.bandit`,
# which `-c` never accepted, so no filter was ever applied in CI.
exclude_dirs = ["tests", "build", ".git"]
skips = [
    "B101",  # assert used: fine outside the test suite's runtime paths
]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
# Coverage floor: measured at 87% (offline run, Ollama-dependent tests
# skipped, which is exactly what CI sees) with a two-point margin. The report
# fails the test job below this. Raise it as coverage grows; never lower it
# to get green.
fail_under = 85
show_missing = false

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]
# *.md: ruff would otherwise reformat Python code blocks in prose; the docs
# are not part of this gate.
extend-exclude = ["build", "dist", ".venv", "*.md"]

[tool.ruff.lint]
# An explicit select rather than ruff's (version-dependent) defaults, so a
# ruff upgrade never silently changes what CI enforces. CI fails on any
# finding; there is no advisory pass.
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # bugbear
    "C4",       # comprehensions
    "SIM",      # simplify
    "PIE", "RUF", "PERF", "RET", "ISC", "FLY",
    "PT",       # pytest style
    "T10",      # debugger left in
    "LOG", "G", # logging
    "PGH",      # blanket noqa / type: ignore
    "PLE",      # pylint errors only
]
ignore = [
    "E501",   # line length: ruff format governs code; long strings/docstrings stay
    "ISC001", # conflicts with the formatter
    "G004",   # f-strings in logging calls are accepted style here
]

[tool.ruff.lint.per-file-ignores]
# pytest-style rules only make sense in the test suite (an application
# function that happens to be named test_* is not a test).
"src/**" = ["PT"]
# Tests assert on exception *types* deliberately; requiring a message match
# on every `pytest.raises` adds noise without catching bugs.
"tests/**" = ["PT011"]

[tool.ruff.lint.isort]
known-first-party = ["talkpipe"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
# 3.12+ so mypy can parse modern dependency stubs (e.g. numpy uses `type`
# statements); the package itself still supports Python 3.11.
python_version = "3.12"
files = ["src"]
# `strict` is the whole mypy strict bundle (disallow_untyped_defs,
# disallow_incomplete_defs, disallow_untyped_calls, disallow_untyped_decorators,
# disallow_any_generics, no_implicit_reexport, warn_return_any, strict_equality,
# extra_checks, ...). Every function in src/ is fully annotated, generics carry
# their type parameters, and a typed function may not leak an untyped (Any)
# value through its return. The package ships a py.typed marker, so these
# annotations are the public typing contract for consumers. Never loosen a
# flag here to get green.
strict = true
# Beyond the strict bundle:
warn_unreachable = true
warn_no_return = true
show_error_codes = true
enable_error_code = ["ignore-without-code"]

[[tool.mypy.overrides]]
# Third-party packages that ship no type information (no py.typed, no stubs).
module = [
    "feedparser.*",
    "greenlet.*",
    "lancedb.*",
    "networkx.*",
    "pandas.*",
    "parsy.*",
    "readability.*",
    "sklearn.*",
    "whoosh.*",
    "yaml.*",
]
ignore_missing_imports = true

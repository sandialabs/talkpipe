name: CI/CD Pipeline

on:
  push:
    branches: [ main, 'bugfix/**', 'feature/**', "chore/**" ]
  pull_request:
    branches: [ main, 'bugfix/**', 'feature/**', "chore/**" ]
  release:
    types: [ published ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache pip dependencies
      uses: actions/cache@v6
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        # Install into a project venv rather than the interpreter itself. On a
        # self-hosted runner /opt/hostedtoolcache is a volume shared by every
        # job, so installing there leaks packages between repos.
        python -m venv .venv
        echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
        .venv/bin/python -m pip install --upgrade pip
        .venv/bin/pip install -e ".[dev,all]"
    
    - name: Run tests with coverage
      run: |
        # --cov-report=term makes the [tool.coverage.report] fail_under floor
        # in pyproject.toml fail this step; xml/html are for Codecov and
        # local inspection.
        pytest --cov=src --cov=appcenter --cov-report=term --cov-report=xml --cov-report=html
    
    - name: Upload coverage to Codecov
      if: matrix.python-version == '3.11'
      uses: codecov/codecov-action@v7
      with:
        files: ./coverage.xml
        flags: unittests

  lint:
    # Ruff (lint + format) and mypy gate the build; there is no advisory
    # pass and nothing here may swallow a failure. Local equivalent:
    # `pre-commit run --all-files`, or the three commands below.
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        # see the note on the test job's install step
        python -m venv .venv
        echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
        .venv/bin/python -m pip install --upgrade pip
        .venv/bin/pip install -e ".[dev,all]"

    - name: Ruff lint
      run: ruff check --output-format=github .

    - name: Ruff format check
      run: ruff format --check --diff .

    - name: mypy
      run: mypy

    - name: Entry points match the registered sources and segments
      run: |
        # Regenerate the talkpipe.sources / talkpipe.segments tables from the
        # @register_* decorators; any diff means a component was added or
        # renamed without updating pyproject.toml (it would be invisible to
        # name lookup until its module happened to be imported).
        python .cursor/skills/update-entry-points/scripts/update_entry_points.py
        git diff --exit-code -- pyproject.toml

  package:
    # Build the sdist and wheel the way a release would, then install the
    # wheel into a clean venv and import/run it. Without this a broken
    # wheel is only discovered by publish-package, at release time.
    # Host-neutral: runs unchanged on any Actions-compatible runner.
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0   # setuptools_scm derives the version from tags

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    - name: Build sdist and wheel
      run: |
        # see the note on the test job's install step
        python -m venv .venv
        echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
        .venv/bin/python -m pip install --upgrade pip
        .venv/bin/pip install build twine
        .venv/bin/python -m build
        .venv/bin/twine check dist/*

    - name: Install the wheel into a clean venv and smoke-test it
      run: |
        python -m venv .smoke
        .smoke/bin/python -m pip install --upgrade pip
        .smoke/bin/pip install dist/*.whl
        # Import the package plus the two subpackages that ship without
        # __init__.py history, and prove the version metadata resolves.
        .smoke/bin/python -c "import talkpipe, talkpipe.search.lancedb, talkpipe.data.text.cleaning; print(talkpipe.__version__)"
        .smoke/bin/chatterlang_script --help
        # Every declared entry point must resolve in the installed wheel.
        .smoke/bin/python - <<'PY'
        from importlib.metadata import entry_points
        bad = []
        for group in ("talkpipe.sources", "talkpipe.segments"):
            for ep in entry_points(group=group):
                try:
                    ep.load()
                except Exception as exc:  # noqa: BLE001
                    bad.append(f"{group}:{ep.name} -> {exc!r}")
        if bad:
            raise SystemExit("unresolvable entry points:\n" + "\n".join(bad))
        print("all entry points resolve")
        PY

    - name: Run the TalkPipe App Center the way users do
      run: |
        # appcenter/talkpipe_appcenter.py is a single file users run with `uv run`; it
        # must work from a plain interpreter that has only its one declared
        # dependency, from any directory, without the talkpipe package.
        python -m venv .appcenter
        .appcenter/bin/pip install "textual>=8,<9"
        cp appcenter/talkpipe_appcenter.py /tmp/talkpipe_appcenter.py
        (cd /tmp && TALKPIPE_APPCENTER_OFFLINE=1 UV=/bin/true "$GITHUB_WORKSPACE/.appcenter/bin/python" talkpipe_appcenter.py list)
        .appcenter/bin/python /tmp/talkpipe_appcenter.py --version

  lockfile-check:
    # uv.lock is a development convenience only -- CI installs with pip on
    # purpose (see README, "Development environment"). This job installs
    # nothing from the lock; it only fails when uv.lock has drifted out of
    # sync with pyproject.toml, so the committed lock cannot go stale
    # unnoticed.
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v7

    - name: Check uv.lock is in sync with pyproject.toml
      run: uv lock --check

  security-scan:
    runs-on: ubuntu-latest
    needs: [test, lint]
    env:
      SAFETY_API_KEY: ${{ secrets.SAFETY_API_KEY }}

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'
    
    - name: Install dependencies for security scan
      run: |
        # see the note on the test job's install step
        python -m venv .venv
        echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
        # `python -m venv` seeds the venv with whatever pip and setuptools the
        # interpreter bundles, and safety scans the whole venv, so upgrade
        # both: a stale bundled setuptools fails the scan on an advisory
        # unrelated to anything this project declares or installs.
        .venv/bin/python -m pip install --upgrade pip setuptools
        .venv/bin/pip install -e ".[dev,all]"
        # safety shares this venv with the project, and the project's `all`
        # extra pulls in httpx2 (openai 3.x and anthropic 1.x depend on it).
        # authlib 1.8.0 (safety's OAuth client) switches its httpx integration
        # to httpx2 whenever httpx2 is importable, but safety 3.8.1 still
        # builds httpx-0.28 Timeout objects for it, so every `safety` command
        # crashes during auth setup with "'Timeout' object cannot be
        # interpreted as an integer". Hold authlib below 1.8 until a safety
        # release supports it. This is a CI tool pin, not a project floor.
        .venv/bin/pip install bandit safety "authlib<1.8"

    - name: Run Bandit security scan
      run: |
        bandit -c pyproject.toml -r src/ appcenter/talkpipe_appcenter.py -f json -o bandit-report.json
        bandit -c pyproject.toml -r src/ appcenter/talkpipe_appcenter.py -f txt

    - name: Run Safety dependency scan
      run: |
        if [ -n "${SAFETY_API_KEY:-}" ]; then
          # Authenticated: the commercial database, gated by .safety-policy.yml.
          safety scan --save-as json safety-report.json
          safety scan
        else
          # Repository secrets are not passed to pull-request runs, so the key
          # is absent there and `safety scan` would only ask us to log in.
          # Fall back to the free database rather than failing for lack of auth
          # or, worse, passing without scanning anything. This still fails the
          # build on a known vulnerability -- the database is just staler than
          # the authenticated scan that gates pushes to main.
          echo "SAFETY_API_KEY unavailable; falling back to 'safety check' (free database)."
          # `check` is the legacy command and the only one that runs without an
          # account. It rejects .safety-policy.yml because that file is v3.0 and
          # only `scan` parses v3, so run it from a directory holding no policy
          # file; it scans the installed environment either way.
          report="$PWD/safety-report.json"
          workdir="$(mktemp -d)"
          (cd "$workdir" && safety check --save-json "$report")
        fi
    
    - name: Upload security scan results
      uses: actions/upload-artifact@v7
      # upload-artifact v4+ refuses to run when the server isn't github.com
      if: always() && github.server_url == 'https://github.com'
      with:
        name: security-reports
        path: |
          bandit-report.json
          safety-report.json

  build-container:
    runs-on: ubuntu-latest
    needs: [test, lint, security-scan]
    # pushes to ghcr.io with a GitHub token; only available on github.com
    if: github.server_url == 'https://github.com'
    permissions:
      contents: read
      packages: write
      security-events: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
    
    - name: Log in to Container Registry
      uses: docker/login-action@v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Set up QEMU
      if: github.event_name == 'release'
      uses: docker/setup-qemu-action@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha
          type=raw,value=latest,enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}
          type=raw,value=experimental,enable=${{ github.event_name == 'release' && github.event.release.prerelease }}
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v7
      with:
        context: .
        platforms: ${{ github.event_name == 'release' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
        # only releases publish images; other runs build (and Trivy-scan)
        # without pushing, so `load` puts the image in the local daemon
        push: ${{ github.event_name == 'release' }}
        load: ${{ github.event_name != 'release' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Extract first tag for Trivy
      id: first-tag
      run: echo "tag=$(echo '${{ steps.meta.outputs.tags }}' | head -n1)" >> $GITHUB_OUTPUT
    
    - name: Run container security scan with Trivy
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ steps.first-tag.outputs.tag }}
        format: 'sarif'
        output: 'trivy-results.sarif'
    
    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v4
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

  codeql-analysis:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    # needs GitHub's code-scanning API, only available on github.com
    if: github.server_url == 'https://github.com'
    permissions:
      actions: read
      contents: read
      security-events: write
    
    strategy:
      fail-fast: false
      matrix:
        language: [ 'python' ]
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
    
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
    
    - name: Autobuild
      uses: github/codeql-action/autobuild@v4
    
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4

  publish-package:
    runs-on: ubuntu-latest
    # build-container is GitHub-only; listing it here would leave publishing
    # blocked behind a skipped job everywhere else. The container image is
    # published independently by that job on github.com.
    needs: [test, lint, package, security-scan]
    # Version tags only. The rolling `experimental` release is a container for
    # assets, not a version: publishing from it would upload a distribution
    # whose setuptools_scm version came from a tag that is not one.
    if: github.event_name == 'release' && github.event.action == 'published' && startsWith(github.event.release.tag_name, 'v')

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'
    
    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine
    
    - name: Build package
      run: python -m build
    
    - name: Check package
      run: twine check dist/*
    
    - name: Publish to PyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: twine upload dist/*

  release-assets:
    # The TalkPipe App Center is one file users run with `uv run <url>`; each
    # release attaches it, stamped with the tag so a copy can report which
    # release it came from, plus the two bootstrap scripts. GitHub only: the
    # upload uses the GitHub token and the releases/latest/download URL.
    runs-on: ubuntu-latest
    needs: [test, lint, package, security-scan]
    # Version tags only, so a re-publish of the rolling `experimental` release
    # cannot stamp its own tag name into the file it then re-attaches.
    if: github.event_name == 'release' && github.event.action == 'published' && github.server_url == 'https://github.com' && startsWith(github.event.release.tag_name, 'v')
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    - name: Stamp the release version into the App Center file
      run: |
        tag="${{ github.event.release.tag_name }}"
        version="${tag#v}"
        sed -i "s/^STAMPED_VERSION = \"0.0.0+unknown\"$/STAMPED_VERSION = \"${version}\"/" appcenter/talkpipe_appcenter.py
        grep -q "^STAMPED_VERSION = \"${version}\"$" appcenter/talkpipe_appcenter.py
        python -m venv .appcenter
        .appcenter/bin/pip install "textual>=8,<9"
        reported="$(.appcenter/bin/python appcenter/talkpipe_appcenter.py --version)"
        test "$reported" = "talkpipe-appcenter ${version}"

    - name: Attach the App Center and its bootstrap scripts to the release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release upload "${{ github.event.release.tag_name }}" \
          appcenter/talkpipe_appcenter.py appcenter/install.sh appcenter/install.ps1 --clobber

    - name: Refresh the rolling experimental channel
      # `releases/latest/download/` resolves to the newest release GitHub does
      # not consider a pre-release, so it cannot serve a beta at all. The
      # `experimental` release is a fixed anchor that always holds the assets of
      # the newest release of either kind -- deliberately unlike the container
      # `experimental` tag above, which pre-releases only, so that a beta is not
      # served forever after a full release supersedes it.
      #
      # Assets move; the tag does not. `upload --clobber` replaces the files
      # without touching the commit the release points at, so nobody's fetched
      # tags are ever rewritten. That commit is therefore meaningless, which is
      # what the notes below exist to say.
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        tag="${{ github.event.release.tag_name }}"
        notes="Rolling channel: these assets are from ${tag}."
        notes="${notes} The \`experimental\` tag itself is a fixed anchor and does not track that release's commit."
        notes="${notes} See RELEASING.md."
        gh release view experimental >/dev/null 2>&1 || \
          gh release create experimental --prerelease \
            --title "Experimental (rolling)" --notes "${notes}"
        gh release upload experimental \
          appcenter/talkpipe_appcenter.py appcenter/install.sh appcenter/install.ps1 --clobber
        gh release edit experimental --prerelease --notes "${notes}"
        reported="$(.appcenter/bin/python appcenter/talkpipe_appcenter.py --version)"
        echo "experimental channel now serves ${reported}"

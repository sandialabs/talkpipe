[pytest]
log_level = DEBUG
# appcenter/tests import the single-file TalkPipe App Center as a top-level module.
pythonpath = appcenter
# Auto mode runs the App Center's coroutine (Textual Pilot) tests under
# pytest-asyncio without a mark; the library's tests are all synchronous.
asyncio_mode = auto
markers =
    requires_ollama: mark test as requiring Ollama (LLM examples). Skip with -m "not requires_ollama".
    requires_openai: mark test as requiring an OpenAI API key.
    requires_anthropic: mark test as requiring an Anthropic API key.

